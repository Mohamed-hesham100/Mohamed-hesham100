<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 216" width="1000" height="216" role="img" aria-label="Backend and APIs, Payments and integrations, Deployment"><rect x="11" y="13" width="304" height="196" rx="20" fill="#121212"/><rect x="4" y="6" width="304" height="196" rx="20" fill="#CDF5DE" stroke="#121212" stroke-width="3" /><rect x="31" y="29" width="46" height="46" rx="12" fill="#121212"/><rect x="28" y="26" width="46" height="46" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="3" /><text x="51" y="56" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="17" fill="#121212">{ }</text><text x="30" y="104" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="16" fill="#121212">Backend &amp; APIs</text><text x="30" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">REST APIs with Node.js/Express and</text><text x="30" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">Django REST Framework, secured</text><text x="30" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">with JWT and OAuth 2.0.</text><rect x="343" y="13" width="304" height="196" rx="20" fill="#121212"/><rect x="336" y="6" width="304" height="196" rx="20" fill="#FFF1A8" stroke="#121212" stroke-width="3" /><rect x="363" y="29" width="46" height="46" rx="12" fill="#121212"/><rect x="360" y="26" width="46" height="46" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="3" /><text x="383" y="56" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="17" fill="#121212">$</text><text x="362" y="104" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="16" fill="#121212">Payments &amp; Integrations</text><text x="362" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">Gateways and shipping carriers for</text><text x="362" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">the Saudi and Egyptian markets,</text><text x="362" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">with secure webhook handling.</text><rect x="675" y="13" width="304" height="196" rx="20" fill="#121212"/><rect x="668" y="6" width="304" height="196" rx="20" fill="#E3D9FF" stroke="#121212" stroke-width="3" /><rect x="695" y="29" width="46" height="46" rx="12" fill="#121212"/><rect x="692" y="26" width="46" height="46" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="3" /><text x="715" y="56" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="17" fill="#121212">&gt;_</text><text x="694" y="104" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="16" fill="#121212">Deployment</text><text x="694" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">Linux VPS, Nginx, PM2, GitHub</text><text x="694" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">Actions CI/CD, SSL/TLS automation,</text><text x="694" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1F1F1F">and server hardening.</text></svg>