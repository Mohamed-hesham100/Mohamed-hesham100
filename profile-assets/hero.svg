.dash{animation:ds 1s linear infinite}
@keyframes ds{to{stroke-dashoffset:-10}}
.spin{transform-origin:852px 122px;animation:sp 16s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
</style>
