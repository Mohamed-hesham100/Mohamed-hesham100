<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-label="Mohamed Hisham - Full-Stack Developer. I build the whole request path: UI, API, payments, database and server.">
<defs><path id="circ" d="M 792,122 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/></defs>
<style>
.nd{animation:fl 6s linear infinite}
@keyframes fl{0%,14%{fill:#FFD23F}22%,100%{fill:#FFFFFF}}
.pk{animation:pk 6s linear infinite}
