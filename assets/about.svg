<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 266" width="1000" height="266" role="img" aria-label="About">
<rect x=".75" y=".75" width="998.5" height="264.5" rx="16" fill="#0B1020" stroke="#22304A"/>
<text x="32" y="52" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">I build secure, production-ready web applications and take them all the way to production myself: the API,</text>
<text x="32" y="78" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">the database, and the Linux server they run on.</text>
<text x="32" y="116" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">My main work is two e-commerce platforms for the Saudi and Egyptian markets, integrated with local payment</text>
<text x="32" y="142" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">gateways and shipping carriers, and Secrela, a B2B platform that helps companies protect their sensitive</text>
<text x="32" y="168" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">data.</text>
<text x="32" y="206" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">I&#x27;m a Computer Science student at EELU (expected 2027), open to full-time opportunities, including</text>
<text x="32" y="232" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#CBD5E1">relocation.</text>
</svg>