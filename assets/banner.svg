<text class="ln" style="animation-delay:2.75s;white-space:pre" x="582.8" y="252" font-family="'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace" font-size="14"><tspan fill="#93C5FD">openTo</tspan><tspan fill="#8FA1BC">: </tspan><tspan fill="#34D399">&quot;Full-time roles&quot;</tspan><tspan fill="#8FA1BC">,</tspan></text>
