<text class="ln" style="animation-delay:1.85s;white-space:pre" x="582.8" y="200" font-family="'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace" font-size="14"><tspan fill="#93C5FD">focus</tspan><tspan fill="#8FA1BC">: [</tspan><tspan fill="#34D399">&quot;E-commerce&quot;</tspan><tspan fill="#8FA1BC">, </tspan><tspan fill="#34D399">&quot;Payments&quot;</tspan><tspan fill="#8FA1BC">],</tspan></text>
