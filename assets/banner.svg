<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Mohamed Hisham - Full-Stack Developer">
<defs>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
<radialGradient id="a1"><stop offset="0" stop-color="#6366F1" stop-opacity=".6"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<radialGradient id="a2"><stop offset="0" stop-color="#22D3EE" stop-opacity=".42"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<radialGradient id="a3"><stop offset="0" stop-color="#C084FC" stop-opacity=".4"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="cl"><rect width="1000" height="340" rx="22"/></clipPath>
</defs>
<style>
.f1{animation:f1 14s ease-in-out infinite alternate}
.f2{animation:f2 17s ease-in-out infinite alternate}
.f3{animation:f3 20s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(70px,40px)}}
@keyframes f2{to{transform:translate(-60px,-30px)}}
@keyframes f3{to{transform:translate(-40px,50px)}}
.ln{animation:fin .6s ease backwards}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pl{animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
</style>
<g clip-path="url(#cl)">
