<text x="52" y="210" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#nm)" letter-spacing="-1.5">Hisham</text>
<text x="56" y="250" font-family="'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#E6EDF7">Full-Stack Developer</text>
